{{define "header"}}
<header class="header">
  <div class="header-judul">
    <label class="menu-toggle" for="tombol-menu" title="Buka / tutup menu">&#9776;</label>
    <span class="logo">SeduhPoin</span>
    <span class="header-sub">Kedai Kopi Seduh &middot; POS + Loyalty Program</span>
  </div>
  <div class="header-kanan">
    <span class="jam">WIB &middot; {{now}}</span>
    {{if .Identitas.Boleh "STAFF"}}
    <a href="/transaksi" class="tombol tombol-kecil tombol-krem">+ Transaksi Baru</a>
    {{end}}
    <div class="chip-pengguna">
      <span class="chip-nama">{{.Identitas.Nama}}</span>
      <span class="chip-peran peran-{{lower .Identitas.Peran}}">{{labelPeran .Identitas.Peran}}</span>
    </div>
  </div>
</header>
{{end}}
